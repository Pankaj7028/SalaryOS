spring:
  application:
    name: salary-service

  # ─────────────────────────────────────────────────────────────────────────────
  # P0.2 ONLY. data-jpa, flyway and the postgres driver are on the classpath, but
  # no database exists until P0.3 provisions Neon. Without these exclusions the
  # context fails to start for want of a DATABASE_URL.
  #
  # DELETE THIS WHOLE `autoconfigure` BLOCK AT P0.3. Left in place it silently
  # disables persistence: repositories stop being created and Flyway never runs,
  # and the app still starts cleanly — which is the worst way to find out.
  #
  # Class names are Boot 4 per-module packages (…boot.jdbc.autoconfigure.…),
  # not the Boot 3 …boot.autoconfigure.jdbc.… ones.
  # ─────────────────────────────────────────────────────────────────────────────
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

app:
  jwt:
    # ≥32 bytes (CLAUDE.md §10). The fallback is dev/test-only — every real environment sets
    # APP_JWT_SIGNING_KEY, and this default is obviously not that.
    signing-key: ${APP_JWT_SIGNING_KEY:dev-only-signing-key-do-not-use-in-prod-32b}
  session:
    ttl: ${APP_SESSION_TTL:20m}
  refresh:
    ttl: ${APP_REFRESH_TTL:12h}
  cors:
    # CLAUDE.md §10: explicit allow-list, never a wildcard — allowCredentials requires it.
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
  # The normalisation target (CLAUDE.md §6.4/§10) — every comp record's normalized_annual_base
  # is in this currency, pinned via fx_rates, never recomputed at today's rate.
  base-currency: ${APP_BASE_CURRENCY:USD}
  seed:
    # P9.1: threaded through every generator so two runs on empty databases produce identical
    # data — no UUID.randomUUID(), no Instant.now(), no Math.random() anywhere in seed/.
    random-seed: ${APP_SEED_RANDOM_SEED:20260820}
    # Refuses to run against a non-empty employees table unless this is true (--app.seed.force=true).
    force: ${APP_SEED_FORCE:false}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.acme.salaryos: DEBUG
